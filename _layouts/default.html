<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — Aya{% else %}Aya — Blog{% endif %}</title>
<meta name="description" content="{{ page.excerpt | default: site.description }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/logo.svg' | relative_url }}">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>

<div class="glow glow--a"></div>
<div class="glow glow--b"></div>
<canvas id="grid-canvas"></canvas>
<div class="noise-overlay"></div>

<nav class="nav">
  <a href="{{ '/' | relative_url }}" class="brand">
    <img src="{{ '/assets/logo.svg' | relative_url }}" alt="">
    <span class="accent">.SEC</span>
  </a>
  <div class="nav-links">
    <a href="{{ '/' | relative_url }}#about">About</a>
    <a href="{{ '/' | relative_url }}#projects">Projects</a>
    <a href="{{ '/blog/' | relative_url }}">Blog</a>
    <a href="{{ '/' | relative_url }}#contact">Contact</a>
  </div>
  <a href="{{ '/' | relative_url }}#contact" class="nav-cta">Get in touch</a>
</nav>

<main>
  {{ content }}
</main>

<footer>
  <span>&copy; 2026 Aya. Built &amp; deployed on GitHub Pages.</span>
  <span>Algiers, Algeria</span>
</footer>

<script src="{{ '/script.js' | relative_url }}"></script>
</body>
</html>
